# Keybindings — prepend_keymap entries win over the built-in defaults.
# Defaults: https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/keymap-default.toml
# Built-in: Enter / o = open with first opener, Shift-Enter / O = choose
# opener, y/x/p = yank/cut/paste, d = trash, a = create, r = rename,
# . = toggle hidden, z = zoxide jump, Z = fzf jump, ~ = help.

[mgr]
prepend_keymap = [
	# smart-enter plugin: l / Right enters a directory or opens a file
	{ on = "l",       run = "plugin smart-enter", desc = "Enter directory or open file" },
	{ on = "<Right>", run = "plugin smart-enter", desc = "Enter directory or open file" },

	# Always edit in Helix, whatever the file type (e.g. .md that Enter
	# would send to the macOS default app)
	{ on = "e", run = 'shell --block "hx %s"', desc = "Edit in Helix" },
]
