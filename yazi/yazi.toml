# Yazi behaviour. The whole yazi/ directory is symlinked to ~/.config/yazi
# by install.sh, so keymap.toml, theme.toml, init.lua and package.toml
# next to this file are picked up too.
#
# Yazi ships complete defaults built in — only overrides live here.
# Reference: https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml

[mgr]
ratio          = [ 1, 3, 4 ]   # parent / current / preview column widths
sort_by        = "natural"     # file2 < file10
sort_dir_first = true
linemode       = "size"        # size next to each name (m s / m m / m n to switch)
show_hidden    = true

# [opener] defines *how* to open (named commands); [open] defines *what*
# opens with which opener (rules matched by mime type or path glob).
#
# Yazi 26 substitutes %s with the selected file paths (older versions used
# "$@" — with that, hx starts with no argument and shows an empty buffer).
# block = true suspends yazi and hands the terminal to Helix until it exits.
[opener]
edit = [
	{ run = 'hx %s', desc = "Helix", block = true, for = "unix" },
]

[open]
prepend_rules = [
	# Markdown: Enter -> macOS default app (same as double-click in Finder);
	# Shift-Enter / O lists all three so Helix is one keystroke away.
	# `e` (keymap.toml) always edits in Helix regardless of type.
	{ url = "*.md", use = [ "open", "edit", "reveal" ] },
]
# Everything else keeps the built-in rules: text/* -> edit (Helix),
# image/* -> open, archives -> extract, fallback -> macOS `open`.

# git.yazi plugin: fetch git status so it can be shown in the linemode
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
