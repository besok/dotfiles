# -----------------------------------------------------------------
# Python — basedpyright (types, nav, completions) + ruff (lint & format)
# Mirrors the Zed setup (zed/settings.json): basedpyright is the PyCharm-like
# engine, ruff handles lint, import sorting and formatting. install.sh puts
# `basedpyright` and `ruff` on PATH via pipx.
# -----------------------------------------------------------------
[[language]]
name = "python"
language-servers = ["basedpyright", "ruff"]
auto-format = true
formatter = { command = "ruff", args = ["format", "-"] }

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

# PyCharm-like defaults (see zed/settings.json): "standard" type-checking mode,
# analyse open files only, auto-import completions, and the same inlay hints.
# Import sorting is ruff's job (disableOrganizeImports). A project's
# pyproject.toml [tool.basedpyright] or pyrightconfig.json overrides these.
[language-server.basedpyright.config]
basedpyright.disableOrganizeImports = true
basedpyright.analysis.typeCheckingMode = "standard"
basedpyright.analysis.diagnosticMode = "openFilesOnly"
basedpyright.analysis.autoImportCompletions = true
basedpyright.analysis.autoSearchPaths = true
basedpyright.analysis.useLibraryCodeForTypes = true
basedpyright.analysis.inlayHints.variableTypes = true
basedpyright.analysis.inlayHints.functionReturnTypes = true
basedpyright.analysis.inlayHints.callArgumentNames = true
basedpyright.analysis.inlayHints.genericTypes = false

# `ruff server`: lint + format + import sorting; a project's pyproject.toml /
# ruff.toml wins over these settings.
[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ruff.config.settings]
lineLength = 100
lint = { extendSelect = ["I"] }
codeAction = { disableRuleComment = { enable = false } }

# -----------------------------------------------------------------
# Rust — rust-analyzer, clippy-on-save, lldb-dap for debugging
# -----------------------------------------------------------------
[[language]]
name = "rust"
auto-format = true
language-servers = ["rust-analyzer"]

[language-server.rust-analyzer.config]
check.command = "clippy"
cargo.features = "all"
inlayHints.bindingModeHints.enable = true
inlayHints.closureReturnTypeHints.enable = "with_block"
inlayHints.lifetimeElisionHints.enable = "skip_trivial"
completion.fullFunctionSignatures.enable = true

[language.debugger]
name = "lldb-dap"
transport = "stdio"
command = "lldb-dap"

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { program = "{0}" }

[[language.debugger.templates]]
name = "binary (terminal)"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { program = "{0}", runInTerminal = true }

# -----------------------------------------------------------------
# Zig — zls
# -----------------------------------------------------------------
[[language]]
name = "zig"
auto-format = true
language-servers = ["zls"]
formatter = { command = "zig", args = ["fmt", "--stdin"] }

[language-server.zls]
command = "zls"

# -----------------------------------------------------------------
# C / C++ — clangd (driven by compile_commands.json) + lldb-dap
# -----------------------------------------------------------------
[[language]]
name = "cpp"
auto-format = true
language-servers = ["clangd"]

[language.debugger]
name = "lldb-dap"
transport = "stdio"
command = "lldb-dap"

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { program = "{0}" }

[[language]]
name = "c"
auto-format = true
language-servers = ["clangd"]

[language.debugger]
name = "lldb-dap"
transport = "stdio"
command = "lldb-dap"

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { program = "{0}" }

[language-server.clangd]
command = "clangd"
args = ["--header-insertion=iwyu", "--clang-tidy", "--background-index", "--completion-style=detailed", "--function-arg-placeholders"]

# Forester behavior-tree language (added by forester-lsp)
[language-server.forester-lsp]
command = "forester-lsp"

[[language]]
name = "forester"
scope = "source.forester"
file-types = ["tree"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = ["forester-lsp"]
