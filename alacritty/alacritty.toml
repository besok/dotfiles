[general]
live_config_reload = true

[window]
# Removes window frame and title bar
decorations = "None"
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 1.0
startup_mode = "Maximized"
title = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 600
unfocused_hollow = true

[hints]
alphabet = "jfkdlsahgurieowpq"
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https?:|news:|file:|git:)[^\\s\"'<>`]+"
hyperlinks = true
command = "open" # macOS; use "xdg-open" on Linux
post_processing = true
mouse = { enabled = true }

# Catppuccin Latte (light)
[colors.primary]
background = "#eff1f5"
foreground = "#4c4f69"

[colors.cursor]
text = "#eff1f5"
cursor = "#dc8a78"

[colors.vi_mode_cursor]
text = "#eff1f5"
cursor = "#7287fd"

[colors.selection]
text = "#4c4f69"
background = "#acb0be"

[colors.normal]
black   = "#5c5f77"
red     = "#d20f39"
green   = "#40a02b"
yellow  = "#df8e1d"
blue    = "#1e66f5"
magenta = "#ea76cb"
cyan    = "#179299"
white   = "#acb0be"

[colors.bright]
black   = "#6c6f85"
red     = "#d20f39"
green   = "#40a02b"
yellow  = "#df8e1d"
blue    = "#1e66f5"
magenta = "#ea76cb"
cyan    = "#179299"
white   = "#bcc0cc"

# Alacritty >= 0.13 expects [terminal.shell]; the old top-level [shell]
# only logs a deprecation warning. /bin/bash on macOS is the frozen 3.2,
# so use Homebrew's bash 5.x. On Linux, point this at /usr/bin/bash.
[terminal.shell]
program = "/opt/homebrew/bin/bash"
args = ["-l"]

[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Plus",   mods = "Control",       action = "IncreaseFontSize" },
  { key = "Equals", mods = "Control",       action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Control",       action = "ResetFontSize" },
]

[mouse]
bindings = [
  { mouse = "Right", action = "Paste" },
]

